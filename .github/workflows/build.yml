name: Build WebsiteMod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mc: "1.21.6"
            yarn: "1.21.6+build.1"
            loader: "0.16.14"
            fabric: "0.127.1+1.21.6"
            loom: "1.10-SNAPSHOT"
            mod_version: "1.8.0"
          - mc: "1.21.5"
            yarn: "1.21.5+build.1"
            loader: "0.16.14"
            fabric: "0.128.2+1.21.5"
            loom: "1.10-SNAPSHOT"
            mod_version: "1.9.0"
          - mc: "1.21.4"
            yarn: "1.21.4+build.8"
            loader: "0.16.14"
            fabric: "0.111.0+1.21.4"
            loom: "1.9-SNAPSHOT"
            mod_version: "1.10.0"
          - mc: "1.21.3"
            yarn: "1.21.3+build.2"
            loader: "0.16.14"
            fabric: "0.108.0+1.21.3"
            loom: "1.8-SNAPSHOT"
            mod_version: "1.11.0"
          - mc: "1.21.2"
            yarn: "1.21.2+build.1"
            loader: "0.16.14"
            fabric: "0.106.1+1.21.2"
            loom: "1.8-SNAPSHOT"
            mod_version: "1.12.0"
          - mc: "1.21"
            yarn: "1.21+build.9"
            loader: "0.16.14"
            fabric: "0.102.0+1.21"
            loom: "1.8-SNAPSHOT"
            mod_version: "1.13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Update gradle.properties
        run: |
          sed -i "s/minecraft_version=.*/minecraft_version=${{ matrix.mc }}/" gradle.properties
          sed -i "s/yarn_mappings=.*/yarn_mappings=${{ matrix.yarn }}/" gradle.properties
          sed -i "s/loader_version=.*/loader_version=${{ matrix.loader }}/" gradle.properties
          sed -i "s/fabric_version=.*/fabric_version=${{ matrix.fabric }}/" gradle.properties
          sed -i "s/mod_version=.*/mod_version=${{ matrix.mod_version }}+mc${{ matrix.mc }}/" gradle.properties
          echo "// Target: ${{ matrix.mc }}" >> src/main/java/com/websitemod/WebsiteMod.java
      - name: Update build.gradle loom version
        run: |
          sed -i "s/id 'fabric-loom' version '.*'/id 'fabric-loom' version '${{ matrix.loom }}'/" build.gradle
      - name: Build with Gradle
        run: ./gradlew build
      - name: List build output
        run: ls -la build/libs/
      - name: Rename dev JAR if needed
        run: |
          cd build/libs
          NORMAL=$(ls websitemod-*.jar 2>/dev/null | grep -v '\-dev\.jar' | grep -v '\-sources\.jar' | head -1)
          if [ -z "$NORMAL" ]; then
            for f in websitemod-*-dev.jar; do
              [ -f "$f" ] && mv "$f" "${f%-dev.jar}.jar"
            done
          fi
          ls -la
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: websitemod-${{ matrix.mc }}
          path: |
            build/libs/websitemod-*.jar
            !build/libs/websitemod-*-dev.jar
            !build/libs/websitemod-*-sources.jar
          if-no-files-found: error
